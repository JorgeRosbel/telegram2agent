name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  unit:
    name: Unit and type tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: "pnpm"

      - run: pnpm install

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit and type-level tests
        run: pnpm run test:run

      - name: Build
        run: pnpm run build
