name: Lint and format

on:
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: "pnpm"

      - run: pnpm install

      - name: Prettier
        run: pnpm run check

      - name: ESLint
        run: pnpm run lint
